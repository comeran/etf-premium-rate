# ETF溢价率报告配置文件示例
# 复制此文件为 config.yaml 并填写实际配置

# 数据源配置
# 生产环境建议至少配置 Tushare Token 或东方财富 nid18 cookie 其中一种
# 配置 Tushare Token 后，将优先使用 Tushare 获取场内行情（需在 tushare.pro 注册并获取 token）
data_sources:
  tushare:
    # 在 https://tushare.pro 注册后，在个人中心获取 token
    # 也可通过环境变量 TUSHARE_TOKEN 配置（环境变量优先）
    token: ""
  # 东方财富(em)请求 cookie：akshare 调用东方财富接口时可能被限流，需配置 nid18（见 akshare 相关 issue）
  akshare_em:
    # 从浏览器访问 quote.eastmoney.com 或 push2.eastmoney.com 后，在开发者工具中复制 Cookie 里的 nid18、nid18_create_time
    # 也可通过环境变量 AKSHARE_EM_NID18、AKSHARE_EM_NID18_CREATE_TIME 配置（环境变量优先）
    nid18: ""
    nid18_create_time: ""

# 邮件配置
email:
  # SMTP服务器配置
  smtp:
    host: "smtp.qq.com"  # QQ邮箱SMTP服务器
    # 其他常用邮箱SMTP服务器：
    # Gmail: smtp.gmail.com
    # 163邮箱: smtp.163.com
    # 126邮箱: smtp.126.com
    # Outlook: smtp-mail.outlook.com
    port: 587  # 587为TLS端口，465为SSL端口
    use_tls: true  # 是否使用TLS
    username: "your_email@qq.com"  # 发送邮件的邮箱地址
    password: "your_app_password"  # 邮箱授权码或应用密码（不是登录密码）
  
  # 收件人列表（可以配置多个）
  recipients:
    - "recipient1@example.com"
    - "recipient2@example.com"
  
  # 邮件主题
  subject: "📊 ETF/LOF溢价率排行榜 - {date}"

# 报告配置
report:
  # 排行榜显示数量
  top_n: 10
  
  # 是否只发送溢价率最高的（不发送最低的）
  only_premium: false

# 注意：定时任务配置在 .github/workflows/etf_premium_rate_schedule.yml 中设置
# 不需要在此配置文件中设置 schedule
